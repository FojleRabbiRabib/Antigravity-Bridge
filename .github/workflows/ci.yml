name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Antigravity CLI
      run: curl -fsSL https://antigravity.google/cli/install.sh | bash

    - name: Install build dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install build wheel pytest

    - name: Build package
      run: |
        python3 -m build

    - name: Install package
      run: |
        pip install dist/*.whl

    - name: Run tests
      run: |
        pytest

    - name: Verify package import
      run: |
        python3 -c "import src; print(f'Version: {src.__version__}')"

    - name: Verify CLI availability
      run: |
        agy --version || echo "Antigravity CLI check done"
