[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-bridge"
dynamic = ["version"]
description = "Lightweight MCP server bridging Claude Code to Antigravity AI via official CLI"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Fojle Rabbi Rabib"}
]
keywords = ["mcp", "antigravity", "ai", "coding", "assistant", "claude"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4",
    "ruff>=0.5",
    "black>=24",
    "mypy>=1.10",
]

[project.scripts]
antigravity-bridge = "src:main"

[project.urls]
Homepage = "https://github.com/FojleRabbiRabib/Antigravity-Bridge"
Repository = "https://github.com/FojleRabbiRabib/Antigravity-Bridge"
Issues = "https://github.com/FojleRabbiRabib/Antigravity-Bridge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.setuptools.package-data]
src = ["*.md", "*.txt", "*.env.example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]
