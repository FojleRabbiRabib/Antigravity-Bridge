[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-bridge"
version = "1.0.2"
description = "Lightweight MCP server bridging Claude Code to Antigravity AI via official CLI"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Fojle Rabbi Rabib"}
]
keywords = ["mcp", "antigravity", "ai", "coding", "assistant", "claude"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
antigravity-bridge = "src:main"

[project.urls]
Homepage = "https://github.com/FojleRabbiRabib/Antigravity-Bridge"
Repository = "https://github.com/FojleRabbiRabib/Antigravity-Bridge"
Issues = "https://github.com/FojleRabbiRabib/Antigravity-Bridge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["*.md", "*.txt", "*.env.example"]
